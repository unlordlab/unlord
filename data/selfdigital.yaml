# Corpus curado de Instagram para la herramienta "El self digital".
#
# Instagram NO se puede buscar por API: la Basic Display murio el 4/12/2024
# y la Graph API exige cuenta de empresa, verificacion y revision, con un
# limite de 30 hashtags por semana. Comprobado ademas que su buscador exige
# sesion iniciada y que CORS impide leerlo desde otro dominio.
#
# Lo que SI funciona, y esta comprobado, es el incrustado oficial:
#   https://www.instagram.com/p/<codigo>/embed/
# Sin token, sin API y dentro de sus condiciones.
#
# Como anadir una ciudad:
#   1. Busca la ciudad en Instagram y elige los posts que ilustren la tesis.
#   2. Copia el CODIGO de la URL. De
#        https://www.instagram.com/p/BsOGulcndj-/
#      el codigo es  BsOGulcndj-
#   3. Anade la ciudad aqui abajo. La clave va en minusculas y sin tildes:
#      asi es como la busca la herramienta.
#
# Si una ciudad no esta en esta lista, la herramienta ofrece el enlace a la
# busqueda de Instagram en vez de los incrustados.

ciudades:

  # ------------------------------------------------------------- Barcelona
  # La ciudad de siempre, con siglos de vida propia antes de la camara.
  barcelona: &barcelona
    nombre: "Barcelona"
    posts:
      # Mujer en biquini en un velero frente a la costa.
      - DcTts5CCqoS
      # Hombre en banador en la playa.
      - DcMT24XPJom
      # De espaldas ante la cascada de la Ciutadella: caso intermedio, la
      # persona esta dentro del encuadre pero el sitio todavia se reconoce.
      - DbyZFSklLfg

  # ----------------------------------------------------------------- Miami
  # Destino construido para ser fotografiado: art deco, palmeras, skyline.
  miami: &miami
    nombre: "Miami"
    posts:
      # Conjunto de colores en plena calle, con palmeras y edificios detras.
      - DI_tGP6g4fH
      # En la playa, con los bloques de Miami Beach al fondo.
      - DKr4NdzR2R6
      # Ante una fachada art deco entre vegetacion tropical.
      - DJkctrCPU0J

  # ------------------------------------------------------------- Santorini
  # El caso extremo: encuadres tan repetidos que funcionan como sello.
  santorini: &santorini
    nombre: "Santorini"
    posts:
      # Vestido azul largo con Oia y el mar detras.
      - DO0fKgzjWH-
      # Vestido amarillo en una terraza de Oia, a contraluz.
      - DN5gcRXDPtq
      # En la escalera, con las cupulas azules justo detras: el encuadre
      # canonico de la isla, repetido un millon de veces.
      - DXi1oQgCP5h
  oia: *santorini
  thira: *santorini
