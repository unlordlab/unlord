<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nieve</title>
<meta name="description" content="Paseo en primera persona por un paisaje de alta montaña nevado, con nevada, viento y luz en tiempo real.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<style>
  :root {
    --panel-bg: rgba(12, 17, 26, 0.6);
    --panel-border: rgba(255, 255, 255, 0.12);
    --text: #e9eff7;
    --muted: #a7b4c6;
    --accent: #bfe3ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1018; color: var(--text);
    font: 13px/1.45 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; -webkit-user-select: none; user-select: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; }

  .shade { text-shadow: 0 1px 3px rgba(0,0,0,.65), 0 0 16px rgba(0,0,0,.35); }

  /* Pantalla de inicio / pausa */
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5;
    background: radial-gradient(ellipse at center, rgba(8,12,20,.25), rgba(8,12,20,.7)); transition: opacity .5s; }
  #overlay.off { opacity: 0; pointer-events: none; }
  .card { text-align: center; max-width: 520px; padding: 24px; }
  .card h1 { margin: 0 0 6px; font-size: 22px; font-weight: 400; letter-spacing: .5em; text-transform: uppercase; padding-left: .5em; }
  .card p { margin: 0 0 18px; color: var(--muted); }
  .card .keys { display: grid; grid-template-columns: auto auto; gap: 4px 18px; justify-content: center; text-align: left;
    margin: 0 auto 22px; color: var(--muted); font-size: 12px; }
  .card .keys b { color: var(--text); font-weight: 400; }
  #enter { font: inherit; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--text);
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 10px 26px; cursor: pointer; }
  #enter:hover:not(:disabled) { background: rgba(255,255,255,.16); }
  #enter:disabled { opacity: .5; cursor: progress; }
  #status { margin-top: 12px; min-height: 1.4em; color: var(--muted); font-size: 11px; }
  .back { display: inline-block; margin-top: 16px; color: var(--muted); font-size: 11px; text-decoration: none; }
  .back:hover { color: var(--text); }

  /* Panel de parámetros */
  .panel { position: fixed; right: 16px; top: 16px; width: 270px; max-height: calc(100vh - 32px); overflow: auto; z-index: 6;
    background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 10px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 12px 14px 6px; transition: opacity .4s; }
  .panel.hidden .body { display: none; }
  body.playing .panel { opacity: 0; pointer-events: none; }
  .panel header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .panel header span { letter-spacing: .2em; text-transform: uppercase; font-size: 11px; color: var(--muted); }
  .panel button { background: none; border: 1px solid var(--panel-border); color: var(--text); border-radius: 6px;
    font: inherit; font-size: 11px; padding: 3px 8px; cursor: pointer; }
  .panel button:hover { border-color: var(--accent); }
  .group { border-top: 1px solid var(--panel-border); padding: 8px 0 4px; }
  .group h2 { margin: 0 0 6px; font-size: 10px; font-weight: 400; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
  .row { margin-bottom: 6px; }
  .row label { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
  .row label output { color: var(--text); }
  .row input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  .check { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 11px; margin: 2px 0 8px; }
  .check input { accent-color: var(--accent); margin: 0; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 8px; }
  #g-misc button { margin: 0 4px 8px 0; }

  /* HUD */
  #hud { position: fixed; left: 20px; bottom: 16px; z-index: 4; pointer-events: none; color: #dbe3ee; font-size: 11px; letter-spacing: .06em; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%;
    background: rgba(255,255,255,.45); z-index: 4; pointer-events: none; display: none; }
  body.playing #crosshair { display: block; }
  body.touch #crosshair { display: none; }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 3;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.28) 100%); }

  /* Controles táctiles */
  #touch { display: none; }
  body.touch.playing #touch { display: block; }
  #stick { position: fixed; left: 28px; bottom: 60px; width: 120px; height: 120px; border-radius: 50%; z-index: 4;
    border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.06); }
  #knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
    background: rgba(255,255,255,.25); }
  #pause { position: fixed; right: 16px; top: 16px; z-index: 4; font: inherit; font-size: 11px; color: var(--text);
    background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.3); border-radius: 6px; padding: 6px 10px; }

  #error { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 16px; z-index: 10; background: #0b1018; }

  @media (max-width: 600px) {
    .panel { left: 16px; right: 16px; width: auto; top: auto; bottom: 16px; max-height: 42vh; }
    .card .keys { display: none; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="crosshair"></div>

<div id="overlay">
  <div class="card shade">
    <h1>Nieve</h1>
    <p>Un valle de alta montaña en invierno. Camina, sube a las cumbres y cambia el tiempo cuando quieras.</p>
    <div class="keys">
      <span><b>W A S D</b></span><span>caminar</span>
      <span><b>ratón</b></span><span>mirar</span>
      <span><b>Mayús</b></span><span>correr</span>
      <span><b>Espacio</b></span><span>saltar</span>
      <span><b>F</b></span><span>volar / caminar</span>
      <span><b>Esc</b></span><span>pausa y parámetros</span>
    </div>
    <button id="enter" type="button" disabled>Generando montañas…</button>
    <div id="status"></div>
    <a class="back" href="/">← volver al blog</a>
  </div>
</div>

<div class="panel" id="panel">
  <header><span>Parámetros</span><button id="toggle" type="button">ocultar</button></header>
  <div class="body">
    <div class="presets">
      <button type="button" data-preset="despejado">Despejado</button>
      <button type="button" data-preset="nevada">Nevada</button>
      <button type="button" data-preset="ventisca">Ventisca</button>
      <button type="button" data-preset="atardecer">Atardecer</button>
      <button type="button" data-preset="noche">Noche</button>
    </div>
    <div class="group" id="g-snow"><h2>Nevada</h2></div>
    <div class="group" id="g-wind"><h2>Viento</h2></div>
    <div class="group" id="g-sky"><h2>Cielo</h2></div>
    <div class="group" id="g-misc"><h2>Otros</h2>
      <label class="check"><input type="checkbox" id="sound" checked> Sonido (viento y pasos)</label>
      <label class="check"><input type="checkbox" id="timeflow"> El tiempo avanza solo</label>
      <button type="button" id="respawn">Volver al valle</button>
      <button type="button" id="newworld">Otra cordillera</button>
    </div>
  </div>
</div>

<div id="hud" class="shade"></div>

<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <button id="pause" type="button">pausa</button>
</div>

<div id="error"><p></p></div>

<script type="module" src="./main.js"></script>
</body>
</html>
